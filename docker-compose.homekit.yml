# 同堂 · 原生 HomeKit 桥（可选叠加）
#
# 与主 compose 叠加使用：
#   docker compose -f docker-compose.yml -f docker-compose.homekit.yml up -d
#
# 说明：
# - 原生桥把同一物理设备整机接入家庭 App（PDU=一块磁贴展开各口、温湿度电量合一、
#   多灯合并、热水器可接入），并且操作经同堂权限校验与审计；
# - HomeKit 依赖 mDNS 广播，tongtang-hk 侧车必须 host 网络（Linux Docker / NAS 可用；
#   Docker Desktop for Windows/macOS 不支持，请继续使用默认的 HA 桥模式）；
# - 不叠加此文件时一切如旧（默认 HA 桥模式），已有配对不受影响。
services:
  api:
    environment:
      HOMEKIT_NATIVE: "1"

  hk:
    image: jeesa/tongtang-api:latest
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_DIR: /data
      APP_SECRET: ${APP_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
      HK_PORT_BASE: "52100"
    volumes:
      - tongtang_data:/data
    command: python -m app.hap.daemon
