# 同堂 Tongtang · 一体化单容器部署（前端+后端同一镜像，无需 Nginx）
# 使用：docker compose -f docker-compose.allinone.yml up -d
# 然后打开 http://主机IP:8080 按首次配置向导连接 Home Assistant
name: tongtang

services:
  tongtang:
    image: jeesa/tongtang:latest
    restart: unless-stopped
    ports:
      - "8080:8000"          # 改左边可换访问端口
    environment:
      DATA_DIR: /data
      # 会话签名密钥（必改）：填你自己的随机字符串（openssl rand -hex 32 生成）。
      # 留空也能启动，但每次重启会生成一次性密钥、全员需重新登录。
      APP_SECRET: ""
      INITIAL_ADMIN_PASSWORD: "admin123"   # 首次初始化的管理员密码，登录后请立即修改
      TZ: "Asia/Shanghai"
      # HA 跑在本机时可直接填 http://host.docker.internal:8123；留空则走网页首次配置向导
      HA_URL: ""
      HA_TOKEN: ""
      # 原生 HomeKit 桥·方式 B（静态侧车）需要取消下一行注释；方式 A（自动编排）无需
      # HOMEKIT_NATIVE: "1"
      # 方式 A 的 mDNS 通告地址在此设置（自动透传给侧车）：宿主机装有 WireGuard/Tailscale
      # 等虚拟网卡或多网卡时通告可能选错 IP（配对失败/配件"未连接"），填 NAS 局域网 IP
      # HK_ADDRESS: "192.168.1.10"
      # ── Matter 桥 · 方式 A：自动编排（需同时挂载下方 docker.sock；与方式 B 二选一）──
      # 取消 MT_IMAGE 注释即开通：成员第一次建 Matter 桥时自动创建 tongtang-mt 侧车
      # （host 网络广播 _matterc._udp、共享数据卷），桥全部删光自动回收，镜像标签更新自动重建。
      # 侧车回连同堂的地址默认 http://127.0.0.1:8080——改了访问端口时设 MT_API。
      # MT_IMAGE: "jeesa/tongtang-mt:latest"
      # MT_API: "http://127.0.0.1:8080"
      # 数据目录属主自动修正后以此身份运行（默认 10001）；
      # 想在宿主机上直接读写数据文件，改成你的用户 id（id -u / id -g）
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      # 换成宿主机目录也可以（如 /srv/tongtang/data:/data），
      # 容器启动时会自动修正目录属主，无需手动 chown
      - tongtang_data:/data
      # ── 原生 HomeKit 桥 · 方式 A：自动编排（与下方方式 B 二选一，勿同时启用）──
      # 取消下面一行注释即开通：成员第一次建桥时，同堂自动调用宿主机 Docker
      # 创建 tongtang-hk 侧车容器（host 网络做 mDNS 广播、复用本镜像与数据卷），
      # 桥全部删除后自动回收容器，镜像升级后下次启动自动重建侧车——除此行外零配置。
      # ⚠ 安全提示：挂载 docker.sock 等同于把宿主机管理权限授予本容器。
      # 在意的用户可改用 docker-socket-proxy 只放行 containers 类接口后挂代理地址，
      # 或改用下方「方式 B」静态侧车（不碰 docker.sock），
      # 或都保持注释、使用默认的 HA 桥模式（功能完整，只是按实体暴露配件）。
      # - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── 原生 HomeKit 桥 · 方式 B：compose 静态创建侧车（与方式 A 二选一）──
  # 不愿挂 docker.sock 的用户用这种：取消整段注释（含上方环境变量里的
  # HOMEKIT_NATIVE）后 `docker compose -f docker-compose.allinone.yml up -d`，
  # 侧车长驻、不随桥增删回收。
  # 原生桥能力（两种方式相同）：同一物理设备整机接入家庭 App——PDU 一块磁贴
  # 展开各口、温湿度电量合一、多灯合并、电视遥控、门铃通知、情景/脚本按钮，
  # 且家庭 App 里的操作经同堂权限校验并记入审计。
  # host 网络为 mDNS 广播硬需求：NAS/Linux 可用，Docker Desktop 不支持。
  # hk:
  #   image: jeesa/tongtang:latest
  #   container_name: tongtang-hk
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     DATA_DIR: /data
  #     APP_SECRET: ""            # 与主服务的 APP_SECRET 保持一致
  #     TZ: "Asia/Shanghai"
  #     HK_PORT_BASE: "52100"     # HAP 服务端口起点（每座桥占一个端口）
  #     # 宿主机装了 WireGuard/Tailscale 等虚拟网卡或多网卡时，mDNS 可能通告错误 IP
  #     # （表现：配对最后一步失败 / 已添加的配件一直"未连接"），此时填 NAS 局域网 IP：
  #     # HK_ADDRESS: "192.168.1.10"
  #   volumes:
  #     - tongtang_data:/data     # 必须与主服务共用同一数据卷
  #   command: python -m app.hap.daemon
  #   healthcheck:                # 覆盖镜像自带检查（探 8000 端口对守护进程不适用）→ 看心跳文件
  #     test: ["CMD", "python", "-c", "import os,sys,time; p=os.path.join(os.environ.get('DATA_DIR','/data'),'homekit','.heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<60 else 1)"]
  #     interval: 30s
  #     start_period: 20s

  # ── Matter 桥 · 方式 B：compose 静态创建侧车（与方式 A 二选一）──
  # 一座桥可同时配对 苹果家庭 / Google Home / Alexa（Matter multi-admin），iPhone
  # 扫码直加，无需 HomePod 也无需 HA 的 Matter Server。主服务无需任何开关：
  # 未设置 MT_IMAGE 时同堂自动识别为常驻侧车模式。
  # host 网络为 mDNS/UDP 广播硬需求：NAS/Linux 可用，Docker Desktop 不支持。
  # mt:
  #   image: jeesa/tongtang-mt:latest
  #   container_name: tongtang-mt
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     DATA_DIR: /data
  #     APP_SECRET: ""                    # 与主服务的 APP_SECRET 保持一致
  #     MT_API: "http://127.0.0.1:8080"   # 回连同堂入口；改端口时同步改
  #     TZ: "Asia/Shanghai"
  #   volumes:
  #     - tongtang_data:/data             # 必须与主服务共用同一数据卷
  #   # 健康检查镜像自带（守护进程心跳文件新鲜度），无需另写

networks:
  default:
    enable_ipv6: false   # 规避 IPv6 半通导致的间歇性无响应

volumes:
  tongtang_data:
